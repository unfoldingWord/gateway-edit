name: Run Cypress and Jest Tests

on: [push, pull_request]

env:
  CHILD_CONCURRENCY: 1
  NODE_ENV: test
  CYPRESS_TEST_USERNAME: ${{ secrets.CYPRESS_TEST_USERNAME }}
  CYPRESS_TEST_PASSWORD: ${{ secrets.CYPRESS_TEST_PASSWORD }}
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
jobs:
  mac-electron-build:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20.12.2]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2.1.5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn

      - name: Build macOS Electron Installs
        run: yarn run mac:build-all-gwe-electron

      - name: Find macOS Electron DMGs
        id: find-dmgs
        shell: bash
        run: |
          set -e

          set_dmg_output() {
            local output_prefix="$1"
            local pattern="$2"
            local file

            file="$(find ./dist -maxdepth 1 -type f -name "$pattern" | head -n 1 || true)"

            if [ -n "$file" ]; then
              echo "${output_prefix}_path=$file" >> "$GITHUB_OUTPUT"
              echo "${output_prefix}_name=$(basename "$file")" >> "$GITHUB_OUTPUT"
            fi
          }

          set_dmg_output "gwe_x64" "GatewayEditElectronite-*x64*.dmg"
          set_dmg_output "gwe_arm64" "GatewayEditElectronite-*arm64*.dmg"
          set_dmg_output "gwe_qa_x64" "GatewayEditElectroniteQA-*x64*.dmg"
          set_dmg_output "gwe_qa_arm64" "GatewayEditElectroniteQA-*arm64*.dmg"

      - name: Upload GatewayEditElectronite x64 DMG
#        if: ${{ steps.find-dmgs.outputs.gwe_x64_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-dmgs.outputs.gwe_x64_name }}
          path: ${{ steps.find-dmgs.outputs.gwe_x64_path }}
          if-no-files-found: error

      - name: Upload GatewayEditElectronite arm64 DMG
#        if: ${{ steps.find-dmgs.outputs.gwe_arm64_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-dmgs.outputs.gwe_arm64_name }}
          path: ${{ steps.find-dmgs.outputs.gwe_arm64_path }}
          if-no-files-found: error

      - name: Upload GatewayEditElectroniteQA x64 DMG
#        if: ${{ steps.find-dmgs.outputs.gwe_qa_x64_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-dmgs.outputs.gwe_qa_x64_name }}
          path: ${{ steps.find-dmgs.outputs.gwe_qa_x64_path }}
          if-no-files-found: error

      - name: Upload GatewayEditElectroniteQA arm64 DMG
#        if: ${{ steps.find-dmgs.outputs.gwe_qa_arm64_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-dmgs.outputs.gwe_qa_arm64_name }}
          path: ${{ steps.find-dmgs.outputs.gwe_qa_arm64_path }}
          if-no-files-found: error

  tests-run:
    # disable until we have a better way to test this
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.12.2]
    steps:
      - uses: actions/setup-node@v2.1.5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Checkout
        uses: actions/checkout@v2
      # Install NPM dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v2
        with:
          headless: true
          record: true
          build: yarn build
          start: yarn start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 360
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      - name: Save Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cypress Videos
          path: ./cypress/videos/
      - name: Cypress Coverage Summary
        run: yarn coverage-summary
      # run unit tests
      - name: Run Jest Unit Tests
        run: yarn test:unit
      # Combine test coverage reports
      - name: Combine Cypress & Jest coverage reports
        run: yarn report:combined
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/lcov.info

  upload-to-codecov:
    needs: [tests-run]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
